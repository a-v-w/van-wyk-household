name: Deploy to Vercel (manual)

# Deploys are hand triggered only. Vercel's own Git integration is disabled in
# vercel.json, so this workflow is the single path to production.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run drizzle migrations against the production database before deploying
        type: boolean
        default: true

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Belt and braces: the dispatch UI lets you pick any branch. Refuse anything but main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull Vercel production settings and env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run database migrations
        if: inputs.run_migrations
        run: |
          set -a
          . ./.vercel/.env.production.local
          set +a
          npx drizzle-kit migrate

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
